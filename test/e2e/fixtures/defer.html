<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avenx Defer Tag E2E Fixture</title>
  <script src="/dist/runtime.js"></script>
</head>
<body>
  <div id="app"></div>

  <script>
    const { AvenxComponent } = window.Avenx;

    class DeferDemoApp extends AvenxComponent {
      get template() {
        return `
          <div id="demo-root">
            <!-- Interaction Trigger -->
            <div data-ax-defer="true" data-ax-defer-when="interaction" id="interaction-defer">
              <template data-ax-defer-placeholder>
                <button id="btn-trigger-interaction">Click to load deferred block</button>
              </template>
              <template data-ax-defer-content>
                <div id="interaction-content">Interactive Content Loaded Successfully</div>
              </template>
            </div>

            <!-- Timer Trigger -->
            <div data-ax-defer="true" data-ax-defer-when="timer(200)" id="timer-defer">
              <template data-ax-defer-placeholder>
                <div id="timer-placeholder">Waiting for 200ms timer...</div>
              </template>
              <template data-ax-defer-content>
                <div id="timer-content">Timer Content Loaded</div>
              </template>
            </div>
          </div>
        `;
      }
    }

    const app = new DeferDemoApp();
    app.mount(document.getElementById('app'));
  </script>
</body>
</html>
