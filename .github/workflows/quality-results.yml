name: Publish Benchmark Results and Test Coverage

# Scheduled every Saturday at 12:00 Swiss time (CET/CEST).
# GitHub Actions cron natively uses UTC and does not account for DST changes automatically.
# In Switzerland, local time is CEST (UTC+2) in summer and CET (UTC+1) in winter.
# We schedule for 10:00 UTC ('0 10 * * 6'), which corresponds to 12:00 CEST (summer) and 11:00 CET (winter).
on:
  schedule:
    - cron: '0 10 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-coverage:
    name: Generate & Publish Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Checkout test-cov target repository
        uses: actions/checkout@v4
        with:
          repository: avenx-js/test-cov
          token: ${{ secrets.PAT_TOKEN || secrets.GH_PAT || secrets.DEPLOY_TOKEN }}
          path: target-test-cov

      - name: Deploy coverage report to target repository
        run: |
          mkdir -p coverage
          rsync -av --delete --exclude='.git' ./coverage/ ./target-test-cov/
          cd target-test-cov
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes in test coverage report. Skipping commit and push."
          else
            git commit -m "chore: update test coverage report"
            git push
          fi

  benchmarks:
    name: Generate & Publish Benchmark Results
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate benchmark results
        run: |
          mkdir -p bench-results
          npm run bench:report

      - name: Checkout bench-results target repository
        uses: actions/checkout@v4
        with:
          repository: avenx-js/bench-results
          token: ${{ secrets.PAT_TOKEN || secrets.GH_PAT || secrets.DEPLOY_TOKEN }}
          path: target-bench-results

      - name: Deploy benchmark results to target repository
        run: |
          mkdir -p bench-results
          rsync -av --delete --exclude='.git' ./bench-results/ ./target-bench-results/
          cd target-bench-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes in benchmark results. Skipping commit and push."
          else
            git commit -m "chore: update benchmark results"
            git push
          fi
