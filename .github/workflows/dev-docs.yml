name: Publish Development Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-dev-docs:
    name: Generate & Publish Dev Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate development documentation
        run: npm run docs

      - name: Checkout dev-docs target repository
        uses: actions/checkout@v4
        with:
          repository: avenx-js/dev-docs
          token: ${{ secrets.PAT_TOKEN }}
          path: target-dev-docs

      - name: Deploy documentation to target repository
        run: |
          mkdir -p dev-docs
          rsync -av --delete --exclude='.git' ./dev-docs/ ./target-dev-docs/
          cd target-dev-docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes in dev-docs. Skipping commit and push."
          else
            git commit -m "chore: update generated development docs"
            git push
          fi
